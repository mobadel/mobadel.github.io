name: Fetch icons

# یک‌بارمصرف: محیط توسعه به دامنهٔ مبدأ دسترسی ندارد، ولی runner دارد.
# فایل‌ها را می‌گیرد و base64 آن‌ها را در لاگ می‌ریزد تا در مخزن بنشینند.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: گرفتن آیکون‌ها
        shell: bash
        run: |
          set -euo pipefail
          for name in crude-oil gasoline; do
            url="https://s3-symbol-logo.tradingview.com/${name}--big.svg"
            curl --fail --silent --show-error --max-time 20 -o "$name.svg" "$url"
            echo "=== $name.svg ==="
            echo "bytes: $(stat -c%s "$name.svg") | sha256: $(sha256sum "$name.svg" | cut -d' ' -f1)"
            echo "--- base64 begin $name ---"
            base64 -w 100 "$name.svg"
            echo "--- base64 end $name ---"
          done
