name: Telegram price post

on:
  # هر ساعت راس ساعت تهران. کرون گیت‌هاب سر وقت اجرا نمی‌شود، پس ربع ساعت
  # زودتر بیدار می‌شویم (دقیقهٔ ۱۵ UTC = دقیقهٔ ۴۵ تهران) و اسکریپت تا راس
  # ساعت صبر می‌کند. تهران UTC+3:30 است و ساعت تابستانی ندارد.
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      wait:
        description: 'صبر تا راس ساعت بعدی تهران (خاموش = همین حالا بفرست)'
        type: boolean
        default: false

permissions:
  contents: read

# اگر دو اجرا برای یک ساعت هم‌پوشانی کنند (مثلاً اجرای دستی و کرون)،
# تازه‌تر قبلی را لغو می‌کند تا پست تکراری نرود.
concurrency:
  group: telegram-prices
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/telegram-post.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ارسال پست قیمت
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@tabdexir' }}
          WAIT_FOR_SLOT: ${{ (github.event_name == 'schedule' || inputs.wait) && '1' || '0' }}
        run: node scripts/telegram-post.mjs
