name: Deploy to ParsPack

on:
  push:
    branches:
      - main
    # تغییر در مستندات و ابزار و تست‌ها چیزی روی سرور عوض نمی‌کند؛
    # دیپلوی کامل برایشان فقط دقیقه‌های Actions را می‌سوزاند.
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'tools/**'
      - '**.md'
      - 'scripts/telegram-post.mjs'
      - '.github/workflows/telegram-prices.yml'
  workflow_dispatch:
  # کرون پنج‌دقیقه‌ای اینجا بود و به‌تنهایی کل سهمیهٔ ۲۰۰۰ دقیقه‌ای پلن
  # رایگان را می‌خورد: هر اجرا دو جاب، و هر جاب دست‌کم یک دقیقه حساب
  # می‌شود. ثبت نقطهٔ نمودار حالا با کرون خود هاست (DirectAdmin) است که
  # واقعاً هر پنج دقیقه اجرا می‌شود و هزینه‌ای از Actions ندارد.

permissions:
  contents: read

concurrency:
  group: parspack-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy over FTPS
    runs-on: ubuntu-latest
    environment: production
    # بدون این، یک انتقال گیرکرده تا سقف شش‌ساعتهٔ گیت‌هاب معلق می‌ماند
    # و هیچ‌کس نمی‌فهمد دیپلوی تمام نشده. یک‌بار همین اتفاق افتاد و
    # تغییرات منتشرنشده ماندند در حالی که ران «در حال اجرا» بود.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # کلون پیش‌فرض فقط یک کامیت می‌آورد، پس کامیت مبنای پوش در
        # دسترس نیست و نمی‌شود فهمید چه فایل‌هایی عوض شده‌اند. کل
        # تاریخچه اینجا چند مگابایت است، پس هزینه‌اش ناچیز است.
        with:
          fetch-depth: 0

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp .htaccess _site/
          # scripts بیرون ماند: هیچ صفحه‌ای به آن ارجاع نمی‌دهد و روی
          # سرور فقط سطح حمله اضافه می‌کرد — از جمله فایل‌های .py که
          # به‌صورت متن سرو می‌شدند. ابزارهای توسعه در tools/ هستند که
          # اصلاً منتشر نمی‌شود.
          cp -R assets data api price convert _site/

      # صفحه‌های ایستای جفت‌های پرجستجو و سایت‌مپ. بقیهٔ آدرس‌ها از راه
      # بازنویسی در .htaccess کار می‌کنند. sitemap.xml را بازنویسی
      # می‌کند، پس باید بعد از کپی بالا اجرا شود.
      - name: Capture public rates for initial HTML
        run: node scripts/capture-seo-rates.mjs

      - name: ساخت صفحه‌های جفت‌ها
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-pages.mjs

      # نرخ لحظه‌ای را هنگام دیپلوی می‌گیرد و فقط داخل _site می‌نویسد.
      # نه کرون دارد، نه کامیتی در ریپو می‌سازد. اگر نوبیتکس در دسترس
      # نباشد، همان prices.json کامیت‌شده دست‌نخورده منتشر می‌شود.
      - name: تازه‌سازی نرخ تتر
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # فقط apiv2: نام api.nobitex.ir در DNS وجود ندارد.
          response=$(curl -sS --max-time 20 --retry 2 --retry-delay 3 \
            -H 'user-agent: mobadel-deploy/1.0 (+https://tabdex.ir)' \
            'https://apiv2.nobitex.ir/market/stats?srcCurrency=usdt&dstCurrency=rls') || {
              echo "::warning::نوبیتکس پاسخ نداد؛ اسنپ‌شات کامیت‌شده منتشر می‌شود."
              exit 0
            }
          # latest به ریال است؛ تقسیم بر ۱۰ تا تومان شود (مطابق assets/app.js).
          rate=$(printf '%s' "$response" \
            | jq -r '(.stats["usdt-rls"].latest // empty) | tonumber / 10' 2>/dev/null || true)
          valid=$(printf '%s' "${rate:-0}" | awk '{ print ($1 + 0 > 0) ? "yes" : "no" }')
          if [ "$valid" != "yes" ]; then
            echo "::warning::پاسخ نوبیتکس نامعتبر بود؛ اسنپ‌شات کامیت‌شده منتشر می‌شود."
            exit 0
          fi
          jq -n --argjson rate "$rate" \
            '{updated: (now | todateiso8601), source: "nobitex", rate: $rate}' \
            > _site/data/prices.json
          echo "نرخ تازه شد: $rate تومان"
          cat _site/data/prices.json

      # کلید BrsApi از سکرت به یک فایل PHP نوشته می‌شود. فایل PHP
      # (برخلاف یک فایل متنی) اجرا می‌شود و محتوایش سرو نمی‌شود، پس
      # کلید از بیرون قابل خواندن نیست. کلید هرگز وارد ریپو نمی‌شود.
      # base64 فقط برای فرار از مشکلات نقل‌قول در شل است.
      - name: نوشتن کلید BrsApi
        shell: bash
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BRSAPI_KEY:-}" ]; then
            # عمداً دیپلوی را نمی‌شکنیم: نبودِ کلید فقط یعنی طلا و ارز
            # فیات نرخ ندارند، ولی بقیهٔ سایت باید منتشر شود.
            echo "::warning::سکرت BRSAPI_KEY تعریف نشده؛ نرخ طلا و ارز فیات تا تعریف شدن آن در دسترس نخواهد بود."
            exit 0
          fi
          mkdir -p _site/api
          encoded=$(printf '%s' "$BRSAPI_KEY" | base64 -w0)
          history_encoded=$(printf '%s' "${HISTORY_CAPTURE_TOKEN:-}" | base64 -w0)
          printf '<?php\nreturn ["brsapi_key" => base64_decode("%s"), "history_capture_token" => base64_decode("%s")];\n' "$encoded" "$history_encoded" > _site/api/config.php
          echo "config.php نوشته شد."

      # Python 3 is included in the runner. No apt or Ubuntu mirror is needed.
      - name: Test FTPS uploader
        run: python3 -m unittest discover -s tests -p test_deploy_ftps.py

      - name: Deploy site
        timeout-minutes: 25
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.PARS_FTP_SERVER }}
          FTP_PORT: ${{ secrets.PARS_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.PARS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PARS_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.PARS_FTP_DIRECTORY }}
        run: python3 scripts/deploy-ftps.py

      - name: ثبت اسنپ‌شات نمودارهای بازار
        shell: bash
        env:
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          # rates.php ابتدا کش BRS را تازه می‌کند و سپس همان نرخ‌ها ثبت می‌شوند.
          curl --fail --silent --show-error --max-time 25 'https://tabdex.ir/api/rates.php' > /dev/null
          curl --fail --silent --show-error --max-time 25 \
            -H "X-Tabdex-Internal-Key: $HISTORY_CAPTURE_TOKEN" \
            'https://tabdex.ir/api/history.php?capture=1'

      # «دیپلوی موفق» سه بار پشت سر هم به معنی «منتشر شد» نبود: فایل
      # بی‌صدا جا می‌ماند و هیچ‌جا معلوم نمی‌شد. تنها تأیید واقعی این
      # است که از بیرون نگاه کنیم و ببینیم سرور همان چیزی را می‌دهد که
      # فرستادیم.
      #
      # فهرست عمداً کوتاه است: فایل‌های دست‌نویسی که کل سایت به آن‌ها
      # وابسته است. صفحه‌های تولیدی از همین قالب‌ها می‌آیند، پس اگر
      # این‌ها درست باشند بقیه هم درست‌اند.
      - name: تأیید انتشار روی سرور
        shell: bash
        run: |
          set -uo pipefail
          mismatch=0
          # چند صفحهٔ تولیدی هم سنجیده می‌شوند؛ این‌ها از فهرست گیت بیرون‌اند و
          # یک بار با بامپ هم‌طول نسخه بی‌صدا جا ماندند.
          for file in index.html convert/index.html assets/styles.css assets/site.css assets/app.js assets/home.js assets/price.js \
                      price/index.html price/currency/index.html price/currency/usd/index.html convert/usd-to-irt/index.html methodology/index.html \
                      convert/rahn-ejare/index.html assets/rent-calc.css; do
            [ -f "_site/$file" ] || continue
            expected=$(md5sum "_site/$file" | cut -d' ' -f1)
            # کش‌شکن تا پاسخِ کش‌شدهٔ واسطه‌ها تأیید را الکی سبز نکند.
            actual=$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' \
              "https://tabdex.ir/$file?deploy=$GITHUB_SHA" | md5sum | cut -d' ' -f1) || actual='unreachable'
            if [ "$expected" = "$actual" ]; then
              echo "  ✓ $file"
            else
              echo "::error::$file روی سرور با نسخهٔ این دیپلوی یکی نیست (انتظار $expected، دریافت $actual)."
              mismatch=1
            fi
          done
          # صفحهٔ «تبدیل پرتکرار»: بازنویسی ?amount= در .htaccess باید فعال باشد.
          amount_page=$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' \
            "https://tabdex.ir/convert/usd-to-irt/?amount=1000" || true)
          if printf '%s' "$amount_page" | grep -q '<link rel="canonical" href="https://tabdex.ir/convert/usd-to-irt/?amount=1000">'; then
            echo "  ✓ convert/usd-to-irt/?amount=1000"
          else
            echo "::error::صفحهٔ ?amount=1000 canonical خودش را ندارد؛ قاعده‌های .htaccess اعمال نشده‌اند."
            mismatch=1
          fi
          if [ "$mismatch" -ne 0 ]; then
            echo "::error::انتشار ناقص بود. لاگ گام Deploy site را ببینید."
            exit 1
          fi
          echo "همهٔ فایل‌های کلیدی روی سرور با این دیپلوی یکی هستند."
