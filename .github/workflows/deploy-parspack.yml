name: Deploy to ParsPack

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # تور ایمنیِ ثبت نمودار، نه مسیر اصلی. این کامنت قبلاً می‌گفت
    # «حداقل هر پنج دقیقه»، ولی واقعیت چیز دیگری بود: GitHub کرون‌های
    # پرتکرار را throttle می‌کند و در عمل هر دو تا پنج ساعت یک‌بار اجرا
    # می‌شد، آن هم در ساعتی دلخواه که اغلب بیرون از پنجرهٔ بازار بود.
    # نمودار ۲۴ ساعته با همین روزی یکی دو نقطه پر می‌شد.
    #
    # حالا rates.php هر بار که کشش را تازه می‌کند خودش نقطه ثبت می‌کند.
    # این کرون فقط برای ساعت‌هایی می‌ماند که سایت هیچ بازدیدی ندارد.
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: parspack-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy over FTPS
    runs-on: ubuntu-latest
    environment: production
    # بدون این، یک انتقال گیرکرده تا سقف شش‌ساعتهٔ گیت‌هاب معلق می‌ماند
    # و هیچ‌کس نمی‌فهمد دیپلوی تمام نشده. یک‌بار همین اتفاق افتاد و
    # تغییرات منتشرنشده ماندند در حالی که ران «در حال اجرا» بود.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # کلون پیش‌فرض فقط یک کامیت می‌آورد، پس کامیت مبنای پوش در
        # دسترس نیست و نمی‌شود فهمید چه فایل‌هایی عوض شده‌اند. کل
        # تاریخچه اینجا چند مگابایت است، پس هزینه‌اش ناچیز است.
        with:
          fetch-depth: 0

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp .htaccess _site/
          # scripts بیرون ماند: هیچ صفحه‌ای به آن ارجاع نمی‌دهد و روی
          # سرور فقط سطح حمله اضافه می‌کرد — از جمله فایل‌های .py که
          # به‌صورت متن سرو می‌شدند. ابزارهای توسعه در tools/ هستند که
          # اصلاً منتشر نمی‌شود.
          cp -R assets data api price convert _site/

      # صفحه‌های ایستای جفت‌های پرجستجو و سایت‌مپ. بقیهٔ آدرس‌ها از راه
      # بازنویسی در .htaccess کار می‌کنند. sitemap.xml را بازنویسی
      # می‌کند، پس باید بعد از کپی بالا اجرا شود.
      - name: ساخت صفحه‌های جفت‌ها
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-pages.mjs

      # نرخ لحظه‌ای را هنگام دیپلوی می‌گیرد و فقط داخل _site می‌نویسد.
      # نه کرون دارد، نه کامیتی در ریپو می‌سازد. اگر نوبیتکس در دسترس
      # نباشد، همان prices.json کامیت‌شده دست‌نخورده منتشر می‌شود.
      - name: تازه‌سازی نرخ تتر
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # فقط apiv2: نام api.nobitex.ir در DNS وجود ندارد.
          response=$(curl -sS --max-time 20 --retry 2 --retry-delay 3 \
            -H 'user-agent: mobadel-deploy/1.0 (+https://tabdex.ir)' \
            'https://apiv2.nobitex.ir/market/stats?srcCurrency=usdt&dstCurrency=rls') || {
              echo "::warning::نوبیتکس پاسخ نداد؛ اسنپ‌شات کامیت‌شده منتشر می‌شود."
              exit 0
            }
          # latest به ریال است؛ تقسیم بر ۱۰ تا تومان شود (مطابق assets/app.js).
          rate=$(printf '%s' "$response" \
            | jq -r '(.stats["usdt-rls"].latest // empty) | tonumber / 10' 2>/dev/null || true)
          valid=$(printf '%s' "${rate:-0}" | awk '{ print ($1 + 0 > 0) ? "yes" : "no" }')
          if [ "$valid" != "yes" ]; then
            echo "::warning::پاسخ نوبیتکس نامعتبر بود؛ اسنپ‌شات کامیت‌شده منتشر می‌شود."
            exit 0
          fi
          jq -n --argjson rate "$rate" \
            '{updated: (now | todateiso8601), source: "nobitex", rate: $rate}' \
            > _site/data/prices.json
          echo "نرخ تازه شد: $rate تومان"
          cat _site/data/prices.json

      # کلید BrsApi از سکرت به یک فایل PHP نوشته می‌شود. فایل PHP
      # (برخلاف یک فایل متنی) اجرا می‌شود و محتوایش سرو نمی‌شود، پس
      # کلید از بیرون قابل خواندن نیست. کلید هرگز وارد ریپو نمی‌شود.
      # base64 فقط برای فرار از مشکلات نقل‌قول در شل است.
      - name: نوشتن کلید BrsApi
        shell: bash
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BRSAPI_KEY:-}" ]; then
            # عمداً دیپلوی را نمی‌شکنیم: نبودِ کلید فقط یعنی طلا و ارز
            # فیات نرخ ندارند، ولی بقیهٔ سایت باید منتشر شود.
            echo "::warning::سکرت BRSAPI_KEY تعریف نشده؛ نرخ طلا و ارز فیات تا تعریف شدن آن در دسترس نخواهد بود."
            exit 0
          fi
          mkdir -p _site/api
          encoded=$(printf '%s' "$BRSAPI_KEY" | base64 -w0)
          history_encoded=$(printf '%s' "${HISTORY_CAPTURE_TOKEN:-}" | base64 -w0)
          printf '<?php\nreturn ["brsapi_key" => base64_decode("%s"), "history_capture_token" => base64_decode("%s")];\n' "$encoded" "$history_encoded" > _site/api/config.php
          echo "config.php نوشته شد."

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      # mirror با ignore-time فقط اندازه را می‌بیند، پس تغییرِ هم‌اندازه
      # را بی‌صدا رد می‌کند. گیت دقیقاً می‌داند چه چیزی عوض شده؛ همان
      # فهرست مبنای آپلود اجباری در گام بعد است.
      - name: فهرست فایل‌های تغییرکردهٔ این پوش
        if: github.event_name != 'schedule'
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          : > changed-files.txt
          if [ -n "${PUSH_BEFORE:-}" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMRT "$PUSH_BEFORE" "$GITHUB_SHA" > changed-files.txt
          else
            # اولین پوش یک برنچ، اجرای دستی، یا تاریخچهٔ کوتاه‌شده: مبنای
            # مقایسه وجود ندارد. به‌جای شکستن دیپلوی، فایل‌های دست‌نویسی
            # که کوچک‌اند و بیشترین ریسک هم‌اندازه بودن را دارند می‌روند.
            echo "::warning::کامیت مبنا در دسترس نیست؛ همهٔ فایل‌های assets اجباری آپلود می‌شوند."
            git ls-files 'assets/*.css' 'assets/*.js' '*.html' > changed-files.txt
          fi
          echo "تعداد فایل‌های اجباری: $(wc -l < changed-files.txt)"
          cat changed-files.txt

      - name: Deploy site
        if: github.event_name != 'schedule'
        timeout-minutes: 18
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.PARS_FTP_SERVER }}
          FTP_PORT: ${{ secrets.PARS_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.PARS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PARS_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.PARS_FTP_DIRECTORY }}
        run: |
          set -euo pipefail
          # اسکریپت lftp خط‌به‌خط ساخته می‌شود چون یک خط از آن شرطی است.
          {
            echo 'set cmd:fail-exit yes'
            echo 'set net:max-retries 2'
            echo 'set net:timeout 20'
            # net:timeout فقط تا برقراری اتصال است. انتقالی که وسط کار
            # می‌خوابد سقف نداشت و lftp تا ابد منتظر می‌ماند.
            echo 'set xfer:timeout 90'
            echo 'set net:reconnect-interval-max 15'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ftp:ssl-auth TLS'
            # Temporary workaround for ParsPack's incomplete FTPS certificate chain.
            echo 'set ssl:verify-certificate no'

            # ساعت فایل‌های سرور ممکن است جلوتر از runner باشد. در آن حالت
            # مقایسهٔ timestamp فایل‌های تولیدشدهٔ مبدل را اشتباهاً قدیمی
            # تشخیص می‌دهد؛ با ignore-time تفاوت اندازه مبنای انتقال است.
            echo "mirror --reverse --verbose --parallel=4 --ignore-time _site/ \"$FTP_DIRECTORY\""

            # ولی همان ignore-time یعنی config.php فقط وقتی می‌رود که
            # اندازه‌اش عوض شده باشد، و دو کلید API هم‌طول اندازهٔ یکسان
            # می‌دهند. یک بار کلید عوض شد و بی‌صدا هرگز آپلود نشد، پس سایت
            # با کلید قدیمیِ مسدود ماند. این یکی جدا و بی‌قیدوشرط می‌رود.
            if [ -f _site/api/config.php ]; then
              echo "put -O \"$FTP_DIRECTORY/api\" _site/api/config.php"
            fi

            # config.php تنها قربانی نبود. هر تغییری که طول فایل را عوض
            # نکند از همان سوراخ رد می‌شود: بامپ نسخهٔ کش با رشته‌ای
            # هم‌طول، یا جابه‌جا کردن یک اعلان CSS بین دو قاعده. هر دو
            # اتفاق افتادند و دیپلوی «موفق» گزارش شد در حالی که فایل
            # هرگز نرفته بود.
            #
            # پس هر فایلی که این پوش دست‌کاری کرده، بی‌قیدوشرط هم فرستاده
            # می‌شود. فهرست از خود گیت می‌آید، نه از مقایسهٔ اندازه.
            while IFS= read -r changed; do
              [ -n "$changed" ] || continue
              [ -f "_site/$changed" ] || continue
              target="$FTP_DIRECTORY"
              directory=$(dirname "$changed")
              if [ "$directory" != "." ]; then
                target="$FTP_DIRECTORY/$directory"
              fi
              echo "put -O \"$target\" \"_site/$changed\""
            done < changed-files.txt

            echo bye
          } | lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER"

      - name: ثبت اسنپ‌شات نمودارهای بازار
        shell: bash
        env:
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          # rates.php ابتدا کش BRS را تازه می‌کند و سپس همان نرخ‌ها ثبت می‌شوند.
          curl --fail --silent --show-error --max-time 25 'https://tabdex.ir/api/rates.php' > /dev/null
          curl --fail --silent --show-error --max-time 25 \
            -H "X-Tabdex-Internal-Key: $HISTORY_CAPTURE_TOKEN" \
            'https://tabdex.ir/api/history.php?capture=1'

      # «دیپلوی موفق» سه بار پشت سر هم به معنی «منتشر شد» نبود: فایل
      # بی‌صدا جا می‌ماند و هیچ‌جا معلوم نمی‌شد. تنها تأیید واقعی این
      # است که از بیرون نگاه کنیم و ببینیم سرور همان چیزی را می‌دهد که
      # فرستادیم.
      #
      # فهرست عمداً کوتاه است: فایل‌های دست‌نویسی که کل سایت به آن‌ها
      # وابسته است. صفحه‌های تولیدی از همین قالب‌ها می‌آیند، پس اگر
      # این‌ها درست باشند بقیه هم درست‌اند.
      - name: تأیید انتشار روی سرور
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -uo pipefail
          mismatch=0
          for file in index.html convert/index.html assets/styles.css assets/app.js assets/home.js assets/price.js; do
            [ -f "_site/$file" ] || continue
            expected=$(md5sum "_site/$file" | cut -d' ' -f1)
            # کش‌شکن تا پاسخِ کش‌شدهٔ واسطه‌ها تأیید را الکی سبز نکند.
            actual=$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' \
              "https://tabdex.ir/$file?deploy=$GITHUB_SHA" | md5sum | cut -d' ' -f1) || actual='unreachable'
            if [ "$expected" = "$actual" ]; then
              echo "  ✓ $file"
            else
              echo "::error::$file روی سرور با نسخهٔ این دیپلوی یکی نیست (انتظار $expected، دریافت $actual)."
              mismatch=1
            fi
          done
          if [ "$mismatch" -ne 0 ]; then
            echo "::error::انتشار ناقص بود. لاگ گام Deploy site را ببینید."
            exit 1
          fi
          echo "همهٔ فایل‌های کلیدی روی سرور با این دیپلوی یکی هستند."

  capture-market-history:
    if: github.event_name == 'schedule'
    name: Capture market chart snapshots
    runs-on: ubuntu-latest
    steps:
      - name: ثبت اسنپ‌شات نمودارهای بازار
        shell: bash
        env:
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 'https://tabdex.ir/api/rates.php' > /dev/null
          curl --fail --silent --show-error --max-time 25 \
            -H "X-Tabdex-Internal-Key: $HISTORY_CAPTURE_TOKEN" \
            'https://tabdex.ir/api/history.php?capture=1'