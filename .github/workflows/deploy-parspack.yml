name: Deploy to ParsPack

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # ثبت دادهٔ نمودار ۲۴ساعته؛ GitHub Actions حداقل هر پنج دقیقه اجرا می‌شود.
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: parspack-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy over FTPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp .htaccess _site/
          cp -R assets data scripts api price convert _site/

      # صفحه‌های ایستای جفت‌های پرجستجو و سایت‌مپ. بقیهٔ آدرس‌ها از راه
      # بازنویسی در .htaccess کار می‌کنند. sitemap.xml را بازنویسی
      # می‌کند، پس باید بعد از کپی بالا اجرا شود.
      - name: ساخت صفحه‌های جفت‌ها
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-pages.mjs

      # نرخ لحظه‌ای را هنگام دیپلوی می‌گیرد و فقط داخل _site می‌نویسد.
      # نه کرون دارد، نه کامیتی در ریپو می‌سازد. اگر نوبیتکس در دسترس
      # نباشد، همان prices.json کامیت‌شده دست‌نخورده منتشر می‌شود.
      - name: تازه‌سازی نرخ تتر
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # فقط apiv2: نام api.nobitex.ir در DNS وجود ندارد.
          response=$(curl -sS --max-time 20 --retry 2 --retry-delay 3 \
            -H 'user-agent: mobadel-deploy/1.0 (+https://tabdex.ir)' \
            'https://apiv2.nobitex.ir/market/stats?srcCurrency=usdt&dstCurrency=rls') || {
              echo "::warning::نوبیتکس پاسخ نداد؛ اسنپ‌شات کامیت‌شده منتشر می‌شود."
              exit 0
            }
          # latest به ریال است؛ تقسیم بر ۱۰ تا تومان شود (مطابق assets/app.js).
          rate=$(printf '%s' "$response" \
            | jq -r '(.stats["usdt-rls"].latest // empty) | tonumber / 10' 2>/dev/null || true)
          valid=$(printf '%s' "${rate:-0}" | awk '{ print ($1 + 0 > 0) ? "yes" : "no" }')
          if [ "$valid" != "yes" ]; then
            echo "::warning::پاسخ نوبیتکس نامعتبر بود؛ اسنپ‌شات کامیت‌شده منتشر می‌شود."
            exit 0
          fi
          jq -n --argjson rate "$rate" \
            '{updated: (now | todateiso8601), source: "nobitex", rate: $rate}' \
            > _site/data/prices.json
          echo "نرخ تازه شد: $rate تومان"
          cat _site/data/prices.json

      # کلید BrsApi از سکرت به یک فایل PHP نوشته می‌شود. فایل PHP
      # (برخلاف یک فایل متنی) اجرا می‌شود و محتوایش سرو نمی‌شود، پس
      # کلید از بیرون قابل خواندن نیست. کلید هرگز وارد ریپو نمی‌شود.
      # base64 فقط برای فرار از مشکلات نقل‌قول در شل است.
      - name: نوشتن کلید BrsApi
        shell: bash
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BRSAPI_KEY:-}" ]; then
            # عمداً دیپلوی را نمی‌شکنیم: نبودِ کلید فقط یعنی طلا و ارز
            # فیات نرخ ندارند، ولی بقیهٔ سایت باید منتشر شود.
            echo "::warning::سکرت BRSAPI_KEY تعریف نشده؛ نرخ طلا و ارز فیات تا تعریف شدن آن در دسترس نخواهد بود."
            exit 0
          fi
          mkdir -p _site/api
          encoded=$(printf '%s' "$BRSAPI_KEY" | base64 -w0)
          history_encoded=$(printf '%s' "${HISTORY_CAPTURE_TOKEN:-}" | base64 -w0)
          printf '<?php\nreturn ["brsapi_key" => base64_decode("%s"), "history_capture_token" => base64_decode("%s")];\n' "$encoded" "$history_encoded" > _site/api/config.php
          echo "config.php نوشته شد."

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy site
        if: github.event_name != 'schedule'
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.PARS_FTP_SERVER }}
          FTP_PORT: ${{ secrets.PARS_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.PARS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PARS_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.PARS_FTP_DIRECTORY }}
        run: |
          set -euo pipefail
          # اسکریپت lftp خط‌به‌خط ساخته می‌شود چون یک خط از آن شرطی است.
          {
            echo 'set cmd:fail-exit yes'
            echo 'set net:max-retries 2'
            echo 'set net:timeout 20'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ftp:ssl-auth TLS'
            # Temporary workaround for ParsPack's incomplete FTPS certificate chain.
            echo 'set ssl:verify-certificate no'

            # ساعت فایل‌های سرور ممکن است جلوتر از runner باشد. در آن حالت
            # مقایسهٔ timestamp فایل‌های تولیدشدهٔ مبدل را اشتباهاً قدیمی
            # تشخیص می‌دهد؛ با ignore-time تفاوت اندازه مبنای انتقال است.
            echo "mirror --reverse --verbose --parallel=4 --ignore-time _site/ \"$FTP_DIRECTORY\""

            # ولی همان ignore-time یعنی config.php فقط وقتی می‌رود که
            # اندازه‌اش عوض شده باشد، و دو کلید API هم‌طول اندازهٔ یکسان
            # می‌دهند. یک بار کلید عوض شد و بی‌صدا هرگز آپلود نشد، پس سایت
            # با کلید قدیمیِ مسدود ماند. این یکی جدا و بی‌قیدوشرط می‌رود.
            if [ -f _site/api/config.php ]; then
              echo "put -O \"$FTP_DIRECTORY/api\" _site/api/config.php"
            fi

            echo bye
          } | lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER"

      - name: ثبت اسنپ‌شات نمودارهای بازار
        shell: bash
        env:
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          # rates.php ابتدا کش BRS را تازه می‌کند و سپس همان نرخ‌ها ثبت می‌شوند.
          curl --fail --silent --show-error --max-time 25 'https://tabdex.ir/api/rates.php' > /dev/null
          curl --fail --silent --show-error --max-time 25 \
            -H "X-Tabdex-Internal-Key: $HISTORY_CAPTURE_TOKEN" \
            'https://tabdex.ir/api/history.php?capture=1'
  capture-market-history:
    if: github.event_name == 'schedule'
    name: Capture market chart snapshots
    runs-on: ubuntu-latest
    steps:
      - name: ثبت اسنپ‌شات نمودارهای بازار
        shell: bash
        env:
          HISTORY_CAPTURE_TOKEN: ${{ secrets.HISTORY_CAPTURE_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 'https://tabdex.ir/api/rates.php' > /dev/null
          curl --fail --silent --show-error --max-time 25 \
            -H "X-Tabdex-Internal-Key: $HISTORY_CAPTURE_TOKEN" \
            'https://tabdex.ir/api/history.php?capture=1'