name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gold-fiat-from-tgju
      - name: run new rates.php live
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: |
          set +e
          echo "::notice::now_tehran=$(TZ=Asia/Tehran date +%T)"
          php api/rates.php > r1.json
          echo "::notice::run1 $(jq -c '{source_updated,carried,sources,n:(.assets|length),usd:.assets.usd.toman,gold18:.assets.gold18.toman,silver:.assets.silver.toman,ounce:.assets.goldounce.usd,brent:.assets.brent.usd}' r1.json)"
          code=$(curl -sS -m 20 -o n.json -w '%{http_code}' 'https://api.nobitex.ir/market/stats?srcCurrency=usdt,btc&dstCurrency=rls')
          echo "::notice::nobitex http=$code $(jq -c '{status, usdt:.stats["usdt-rls"].latest, btc:.stats["btc-rls"].latest}' n.json)"
