name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gasoline keys
        run: |
          curl -sS -m 30 -A 'Mozilla/5.0' -o t.json "https://call1.tgju.org/ajax.json?rev=$(date +%s)"
          echo "::notice::$(jq -c '{a:.current.energy_gasoline_rbob,b:.current.energy_commodities_gasoline_rbob,brent:.current.oil_brent.ts}' t.json)"
