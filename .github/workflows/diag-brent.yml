name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe tgju
        run: |
          set +e
          curl -sS -m 30 -A 'Mozilla/5.0' -o t.json https://call1.tgju.org/ajax.json
          curl -sS -m 30 -A 'Mozilla/5.0' -o s.json https://tabdex.ir/api/rates.php
          cat > m.json <<'J'
          {"gold18":"geram18","gold24":"geram24","goldmelted":"mesghal","emami":"sekee","bahar":"sekeb","halfcoin":"nim","quartercoin":"rob","gramcoin":"gerami",
           "usd":"price_dollar_rl","eur":"price_eur","gbp":"price_gbp","chf":"price_chf","aed":"price_aed","try":"price_try","jpy":"price_jpy","cny":"price_cny","aud":"price_aud","cad":"price_cad","rub":"price_rub","sek":"price_sek","inr":"price_inr","pkr":"price_pkr","afn":"price_afn","myr":"price_myr","thb":"price_thb","sar":"price_sar","qar":"price_qar","kwd":"price_kwd","bhd":"price_bhd","omr":"price_omr","iqd":"price_iqd","syp":"price_syp","azn":"price_azn","amd":"price_amd","gel":"price_gel"}
          J
          jq -rn --slurpfile t t.json --slurpfile s s.json --slurpfile m m.json '
            $m[0] | to_entries[] | . as $e
            | ($t[0].current[$e.value]) as $c
            | ($s[0].assets[$e.key].toman) as $old
            | "\($e.key) \($e.value) p=\($c.p // "MISSING") ts=\($c.ts // "-") old=\($old) ratio=\(if $c and $old then ((($c.p|gsub(",";"")|tonumber)/10)/$old*1000|round/1000) else "-" end)"' > out.txt
          split -l 8 out.txt part_
          for f in part_*; do echo "::notice::$(paste -sd'|' $f)"; done
          jq -r '.current|keys[]' t.json | grep -iE 'sek|geram|mesghal|gerami|abshode|ons|^nim|^rob|silver|nogh|copper' | paste -sd' ' | sed 's/^/::notice::gold_keys=/'
