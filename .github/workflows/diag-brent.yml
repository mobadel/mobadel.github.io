name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          K: ${{ secrets.BRSAPI_KEY }}
        run: |
          set +e
          echo "::notice::has_key=$([ -n "$K" ] && echo yes || echo no)"
          curl -sS -m 30 -A 'tabdex-rates/1.0 (+https://tabdex.ir)' "https://api.brsapi.ir/Market/Gold_Currency.php?key=$K" -o gc.json
          jq -c 'to_entries|map({k:.key, n:(.value|length), nonzero:([.value[]?|select((.price//0)>0)]|length), maxt:([.value[]?|.time_unix]|max), sample:(.value[0]|{symbol,price,date,time})})' gc.json | sed 's/^/::notice::gc_summary=/'
