name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          K: ${{ secrets.BRSAPI_KEY }}
        run: |
          set +e
          echo "::notice::has_key=$([ -n "$K" ] && echo yes || echo no)"
          curl -sS -m 30 -A 'Mozilla/5.0' https://tabdex.ir/api/rates.php -o site.json; echo "::notice::site_http_exit=$?"
          jq -c '{updated,source_updated,stale,reason,quota,carried,ttl}' site.json | sed 's/^/::notice::site_meta=/'
          jq -c '{brent:.assets.brent.usd,gasoline:.assets.gasoline.usd,usd:.assets.usd.toman,gold18:.assets.gold18.toman,ounce:.assets.goldounce.usd,silver:.assets.silver.toman}' site.json | sed 's/^/::notice::site_assets=/'
