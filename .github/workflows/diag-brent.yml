name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: final live check
        run: |
          set +e
          out=""
          for i in $(seq 1 7); do
            r=$(curl -sS -m 20 -A 'Mozilla/5.0' "https://tabdex.ir/api/rates.php?x=$RANDOM")
            out="$out|$(TZ=Asia/Tehran date +%T) upd=$(echo "$r" | jq -r '.updated' | cut -c12-19) cron=$(echo "$r" | jq -c '.cron')"
            sleep 30
          done
          echo "::notice::$out"
          r=$(curl -sS -m 20 -A 'Mozilla/5.0' "https://tabdex.ir/api/rates.php?x=$RANDOM")
          echo "::notice::meta $(echo "$r" | jq -c '{source_updated,carried,sources,quota,n:(.assets|length)}')"
          echo "::notice::assets $(echo "$r" | jq -c '{usd:.assets.usd.toman,gold18:.assets.gold18.toman,silver:.assets.silver.toman,copper:.assets.copper.toman,ounce:.assets.goldounce.usd,brent:.assets.brent.usd,gas:.assets.gasoline.usd}')"
