name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: watch cron refreshes
        run: |
          set +e
          out=""
          for i in $(seq 1 9); do
            r=$(curl -sS -m 20 -A 'Mozilla/5.0' "https://tabdex.ir/api/rates.php?x=$RANDOM")
            line="$(TZ=Asia/Tehran date +%T) upd=$(echo "$r" | jq -r '.updated' | cut -c12-19) usd=$(echo "$r" | jq -r '.assets.usd.toman') cron=$(echo "$r" | jq -c '.cron')"
            out="$out|$line"
            sleep 30
          done
          echo "::notice::$out"
          echo "::notice::sources $(curl -sS -m 20 "https://tabdex.ir/api/rates.php?x=$RANDOM" | jq -c '{sources,carried:(.carried|length),quota}')"
