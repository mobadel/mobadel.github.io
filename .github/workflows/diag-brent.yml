name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: silver live
        run: |
          sleep 65
          r=$(curl -sS -m 20 -A 'Mozilla/5.0' "https://tabdex.ir/api/rates.php?x=$RANDOM")
          t=$(curl -sS -m 20 -A 'Mozilla/5.0' "https://call1.tgju.org/ajax.json?rev=$(date +%s)" | jq -c '.current.silver_999|{p,ts}')
          echo "::notice::site silver=$(echo "$r" | jq -c '{toman:.assets.silver.toman,change:.assets.silver.change,updated}') tgju=$t"
          p=$(curl -sS -m 20 -A 'Mozilla/5.0' "https://tabdex.ir/assets/price.js?x=$RANDOM" | grep -o 'asset.id === "silver") return "[^"]*"')
          echo "::notice::price.js $p"
