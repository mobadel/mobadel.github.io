name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/metals-energy-tgju
      - name: run new rates.php live (no key)
        run: |
          set +e
          BRSAPI_KEY= php api/rates.php > r.json
          echo "::notice::$(jq -c '{carried,sources,n:(.assets|length),silver:.assets.silver.toman,ounce:.assets.goldounce.usd,ounce_t:.assets.goldounce.toman,brent:.assets.brent.usd,gas:.assets.gasoline.usd,gas_ch:.assets.gasoline.change,usd:.assets.usd.toman}' r.json)"
          echo "::notice::ids=$(jq -r '.assets|keys|join(",")' r.json)"
