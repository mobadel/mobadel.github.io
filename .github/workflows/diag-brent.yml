name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe tgju
        run: |
          set +e
          for u in https://call1.tgju.org/ajax.json https://call2.tgju.org/ajax.json https://api.tgju.org/v1/market/indicator/summary-table-data/price_dollar_rl; do
            code=$(curl -sS -m 30 -A 'Mozilla/5.0' -o t.json -w '%{http_code}' "$u")
            echo "::notice::$u http=$code bytes=$(wc -c < t.json) top=$(jq -c 'keys?' t.json 2>/dev/null | head -c 300)"
          done
          curl -sS -m 30 -A 'Mozilla/5.0' -o t.json https://call1.tgju.org/ajax.json
          jq -c '.current|length' t.json | sed 's/^/::notice::current_count=/'
          for k in price_dollar_rl price_eur geram18 geram24 mesghal sekee sekeb nim rob gerami price_aed price_gel price_amd price_azn price_syp price_iqd price_myr price_thb ons; do
            jq -c --arg k "$k" '.current[$k]' t.json | sed "s/^/::notice::k_$k=/"
          done
          jq -r '.current|keys[]' t.json | grep -E '^price_[a-z]{3}$' | paste -sd' ' | sed 's/^/::notice::price_keys=/'
          jq -r '.current|keys[]' t.json | grep -viE '^price_' | grep -iE 'sek|geram|mesghal|gold|ons|abshode|coin|rob|nim' | paste -sd' ' | sed 's/^/::notice::gold_keys=/'
