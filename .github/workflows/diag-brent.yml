name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: tgju freshness per host
        run: |
          set +e
          echo "::notice::now_tehran=$(TZ=Asia/Tehran date +%T)"
          for h in call1 call2 call3 call4; do
            curl -sS -m 20 -A 'Mozilla/5.0' -o t.json "https://$h.tgju.org/ajax.json"
            echo "::notice::$h $(jq -c '[.current.price_dollar_rl.ts,.current.price_dollar_rl.p,.current.geram18.ts,.current.sekee.ts,([.current[]|.ts?]|max)]' t.json)"
          done
          curl -sS -m 20 -A 'Mozilla/5.0' -o t.json "https://call1.tgju.org/ajax.json?rev=$(date +%s)"
          echo "::notice::call1_bust $(jq -c '[.current.price_dollar_rl.ts,([.current[]|.ts?]|max)]' t.json)"
