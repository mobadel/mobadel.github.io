name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: refresh.php live
        run: |
          set +e
          echo "::notice::now_tehran=$(TZ=Asia/Tehran date +%T)"
          a=$(curl -sS -m 30 -A 'Mozilla/5.0' "https://tabdex.ir/api/rates.php?x=$RANDOM" | jq -c '{updated,ttl}')
          code=$(curl -sS -m 30 -A 'Mozilla/5.0' -o r.json -w '%{http_code}' "https://tabdex.ir/api/refresh.php")
          echo "::notice::before=$a refresh_http=$code after=$(jq -c '{updated,source_updated,ttl,carried:(.carried|length),sources,n:(.assets|length)}' r.json)"
