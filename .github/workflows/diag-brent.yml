name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: brs 402 message
        env:
          K: ${{ secrets.BRSAPI_KEY }}
        run: |
          set +e
          curl -sS -m 30 -A 'Mozilla/5.0' -o b.json "https://api.brsapi.ir/IME/Certificate.php?key=$K"
          jq -r '.message_error' b.json | fold -w 200 | sed 's/^/::notice::msg=/'
          jq -c 'del(.message_error)|del(.data)' b.json | sed 's/^/::notice::rest=/'
