name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gold-fiat-from-tgju
      - name: run new rates.php live
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: |
          set +e
          php -v | head -1
          summary() {
            jq -c '{stale,reason,source_updated,carried,sources,quota,n:(.assets|length),
              usd:.assets.usd.toman, usd_ch:.assets.usd.change, gold18:.assets.gold18.toman, emami:.assets.emami.toman, jpy:.assets.jpy.toman,
              ounce:.assets.goldounce.usd, ounce_t:.assets.goldounce.toman, brent_t:.assets.brent.toman, silver:.assets.silver.toman, copper:.assets.copper.toman}' "$1"
          }
          php api/rates.php > r1.json; echo "::notice::run1 $(summary r1.json)"
          php api/rates.php > r2.json; echo "::notice::run2_cached $(jq -c '{n:(.assets|length),carried}' r2.json)"
          # کش تازه را کهنه کن، بی‌کلید و با TGJU بسته: همه باید از کش بیایند
          jq '.fetched_unix=0' api/cache/rates.json > x && mv x api/cache/rates.json
          echo '127.0.0.1 call1.tgju.org call2.tgju.org call3.tgju.org call4.tgju.org' | sudo tee -a /etc/hosts >/dev/null
          BRSAPI_KEY= php api/rates.php > r3.json; echo "::notice::run3_no_tgju_no_key $(jq -c '{stale,n:(.assets|length),carried:(.carried|length),sources}' r3.json)"
          jq -r '.assets|keys|join(",")' r1.json | sed 's/^/::notice::ids=/'
