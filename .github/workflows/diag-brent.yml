name: diag brent
on:
  push:
    branches: ['diag/brent-stale']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: live site check
        run: |
          set +e
          echo "::notice::now_tehran=$(TZ=Asia/Tehran date +%T)"
          curl -sS -m 30 -A 'Mozilla/5.0' -o s.json "https://tabdex.ir/api/rates.php?x=$(date +%s)"
          echo "::notice::meta $(jq -c '{stale,reason,source_updated,carried,sources,quota,n:(.assets|length)}' s.json)"
          echo "::notice::assets $(jq -c '{usd:.assets.usd.toman,eur:.assets.eur.toman,gold18:.assets.gold18.toman,emami:.assets.emami.toman,ounce:.assets.goldounce.usd,silver:.assets.silver.toman,copper:.assets.copper.toman,brent:.assets.brent.usd,gasoline:.assets.gasoline.usd}' s.json)"
