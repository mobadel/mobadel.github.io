<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مبدل تومان به تتر | نرخ لحظه‌ای USDT</title>
  <meta name="description" content="تبدیل سریع و لحظه‌ای تتر به تومان و تومان به تتر با نرخ بازار نوبیتکس.">
  <meta name="theme-color" content="#f4f7f5">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=20260817-3">
</head>
<body>
  <a class="skip-link" href="#amount-from">رفتن به مبدل</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="صفحه اصلی مبدل">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3"/></svg>
        </span>
        <span>مبدل</span>
      </a>

      <button class="refresh-button" id="refresh" type="button" aria-label="به‌روزرسانی نرخ" title="به‌روزرسانی نرخ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M18.5 10a7 7 0 0 0-12-3L4 9m16 6-2.5 2a7 7 0 0 1-12-3"/></svg>
      </button>
    </div>
  </header>

  <main class="shell page-main">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">نرخ لحظه‌ای بازار</p>
      <h1 id="page-title">تبدیل تومان به تتر</h1>
      <p class="intro-copy">مقدار را وارد کنید؛ معادل آن با آخرین نرخ تتر در بازار نوبیتکس محاسبه می‌شود.</p>
    </section>

    <section class="converter-card" aria-label="مبدل تتر و تومان">
      <div class="rate-summary" aria-live="polite" aria-atomic="true">
        <strong class="rate-value" id="rate-value">در حال دریافت…</strong>
        <span class="rate-status" id="rate-status">
          <span class="status-dot" aria-hidden="true"></span>
          اتصال به نوبیتکس
        </span>
      </div>

      <div class="fields-wrap">
        <div class="currency-field" data-side="from">
          <label for="amount-from">مقدار</label>
          <div class="field-control">
            <input id="amount-from" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="۱۰٬۰۰۰٬۰۰۰" aria-describedby="rate-value">
            <div class="currency-badge" id="currency-from" aria-label="تومان">
              <span class="currency-icon toman" aria-hidden="true">ت</span>
              <span class="currency-text"><strong>IRT</strong><small>تومان</small></span>
              <span class="currency-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></span>
            </div>
          </div>
        </div>

        <div class="swap-divider">
          <span aria-hidden="true"></span>
          <button id="swap" class="swap-button" type="button" aria-label="جابه‌جایی تتر و تومان" title="جابه‌جایی">
            <svg viewBox="0 0 24 24"><path d="M8 4v16m0 0-3-3m3 3 3-3M16 20V4m0 0-3 3m3-3 3 3"/></svg>
          </button>
          <span aria-hidden="true"></span>
        </div>

        <div class="currency-field" data-side="to">
          <label for="amount-to">معادل</label>
          <div class="field-control output-control">
            <input id="amount-to" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-describedby="rate-value">
            <div class="currency-badge" id="currency-to" aria-label="تتر">
              <span class="currency-icon tether" aria-hidden="true">₮</span>
              <span class="currency-text"><strong>USDT</strong><small>تتر</small></span>
              <span class="currency-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/app.js?v=20260817-3"></script>
</body>
</html>
